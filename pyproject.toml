[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grmhd-emulator-validation"
version = "0.1.0"
description = "Shared validation contracts for GRMHD forecasting emulators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "torch>=2.3", "jsonschema>=4.18"]

[project.scripts]
gval = "grmhd_validation.cli:main"

[project.entry-points."grmhd_validation.adapters"]
persistence = "grmhd_validation.adapters.persistence:Persistence"

[tool.setuptools.packages.find]
include = ["grmhd_validation*"]
